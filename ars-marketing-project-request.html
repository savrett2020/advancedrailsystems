document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nt-size=\"100%,70px\">\n                          <x-import component-from-global-scope=\"AdvancedRailSystemsDesignSystem_4ab9e4.TextInput\" placeholder=\"Event\" value=\"{{ f_eventName }}\" sc-camel-on-change=\"{{ set_eventName }}\" hint-size=\"100%,40px\"><\u002Fx-import>\n                        <\u002Fx-import>\n                        <x-import component-from-global-scope=\"AdvancedRailSystemsDesignSystem_4ab9e4.Field\" label=\"Date\" required=\"{{ true }}\" hint-size=\"100%,70px\">\n                          <x-import component-from-global-scope=\"AdvancedRailSystemsDesignSystem_4ab9e4.TextInput\" type=\"date\" value=\"{{ f_eventDate }}\" sc-camel-on-change=\"{{ set_eventDate }}\" hint-size=\"100%,40px\"><\u002Fx-import>\n                        <\u002Fx-import>\n                        <x-import component-from-global-scope=\"AdvancedRailSystemsDesignSystem_4ab9e4.Field\" label=\"Location\" required=\"{{ true }}\" hint-size=\"100%,70px\">\n                          <x-import component-from-global-scope=\"AdvancedRailSystemsDesignSystem_4ab9e4.TextInput\" placeholder=\"City, venue\" value=\"{{ f_eventLocation }}\" sc-camel-on-change=\"{{ set_eventLocation }}\" hint-size=\"100%,40px\"><\u002Fx-import>\n                        <\u002Fx-import>\n                      <\u002Fdiv>\n                      <x-import component-from-global-scope=\"AdvancedRailSystemsDesignSystem_4ab9e4.Field\" label=\"What does ARS need to provide or accomplish?\" required=\"{{ true }}\" hint-size=\"100%,110px\">\n                        <x-import component-from-global-scope=\"AdvancedRailSystemsDesignSystem_4ab9e4.Textarea\" rows=\"{{ 3 }}\" placeholder=\"Booth, materials, demo hardware, meetings, giveaways.\" value=\"{{ f_eventNeeds }}\" sc-camel-on-change=\"{{ set_eventNeeds }}\" hint-size=\"100%,78px\"><\u002Fx-import>\n                      <\u002Fx-import>\n                      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start\">\n                        <x-import component-from-global-scope=\"AdvancedRailSystemsDesignSystem_4ab9e4.Field\" label=\"Who owns the event internally?\" required=\"{{ true }}\" hint=\"Name and role.\" hint-size=\"100%,86px\">\n                          <x-import component-from-global-scope=\"AdvancedRailSystemsDesignSystem_4ab9e4.TextInput\" placeholder=\"Name + role\" value=\"{{ f_eventOwner }}\" sc-camel-on-change=\"{{ set_eventOwner }}\" hint-size=\"100%,40px\"><\u002Fx-import>\n                        <\u002Fx-import>\n                        <x-import component-from-global-scope=\"AdvancedRailSystemsDesignSystem_4ab9e4.Field\" label=\"What has already been confirmed or ordered?\" hint-size=\"100%,86px\">\n                          <x-import component-from-global-scope=\"AdvancedRailSystemsDesignSystem_4ab9e4.TextInput\" placeholder=\"Registration, booth space, travel, printing\" value=\"{{ f_eventConfirmed }}\" sc-camel-on-change=\"{{ set_eventConfirmed }}\" hint-size=\"100%,40px\"><\u002Fx-import>\n                        <\u002Fx-import>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(5,19,52,.08),0 8px 24px rgba(5,19,52,.06);overflow:hidden\">\n            <div style=\"display:flex;align-items:center;gap:16px;padding:22px 32px;border-bottom:1px solid #eef1f6\">\n              <div style=\"width:30px;height:30px;flex:none;border-radius:50%;background:var(--ars-blue);color:#fff;display:grid;place-items:center;font:600 14px/1 var(--font-body)\">{{ confirmNumber }}<\u002Fdiv>\n              <div style=\"font:600 18px/1.2 var(--font-body);color:var(--text-strong);flex:1\">Submitter confirmation<\u002Fdiv>\n              <div style=\"font:400 12.5px/1 var(--font-mono);letter-spacing:.04em;color:{{ s6Color }}\">{{ s6Label }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:24px 32px 28px;display:flex;flex-direction:column;gap:22px\">\n              <div style=\"border:1px solid #e8ecf3;border-radius:10px;overflow:hidden\">\n                <sc-for list=\"{{ confirmations }}\" as=\"r\" hint-placeholder-count=\"5\">\n                  <div style=\"display:flex;align-items:flex-start;gap:14px;padding:14px 18px;border-bottom:1px solid #f1f4f9;background:{{ r.bg }};transition:background 160ms var(--ease-standard)\">\n                    <x-import component-from-global-scope=\"AdvancedRailSystemsDesignSystem_4ab9e4.Checkbox\" checked=\"{{ r.checked }}\" sc-camel-on-change=\"{{ r.toggle }}\" label=\"{{ r.label }}\" hint-size=\"100%,24px\"><\u002Fx-import>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <x-import component-from-global-scope=\"AdvancedRailSystemsDesignSystem_4ab9e4.Field\" label=\"Anything else Marketing should know\" hint-size=\"100%,100px\">\n                <x-import component-from-global-scope=\"AdvancedRailSystemsDesignSystem_4ab9e4.Textarea\" rows=\"{{ 2 }}\" placeholder=\"Optional.\" value=\"{{ f_additional }}\" sc-camel-on-change=\"{{ set_additional }}\" hint-size=\"100%,60px\"><\u002Fx-import>\n              <\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border-radius:16px;padding:22px 32px;box-shadow:0 1px 3px rgba(5,19,52,.08),0 8px 24px rgba(5,19,52,.06);display:flex;align-items:center;gap:24px;position:sticky;bottom:16px\">\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font:600 15px/1.3 var(--font-body);color:{{ gateColor }}\">{{ gateTitle }}<\u002Fdiv>\n              <div style=\"font:400 13.5px/1.45 var(--font-body);color:var(--text-muted);margin-top:4px\">{{ gateDetail }}<\u002Fdiv>\n            <\u002Fdiv>\n            <x-import component-from-global-scope=\"AdvancedRailSystemsDesignSystem_4ab9e4.Button\" variant=\"secondary\" sc-camel-on-click=\"{{ saveDraft }}\" hint-size=\"auto,44px\">Save draft<\u002Fx-import>\n            <x-import component-from-global-scope=\"AdvancedRailSystemsDesignSystem_4ab9e4.Button\" variant=\"primary\" size=\"lg\" icon=\"arrow-right\" icon-position=\"right\" disabled=\"{{ submitDisabled }}\" sc-camel-on-click=\"{{ submit }}\" hint-size=\"auto,48px\">Submit request<\u002Fx-import>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst TYPES = [\n  { label: 'Product or sales material', technical: true },\n  { label: 'Writing, design, presentation or website' },\n  { label: 'Tradeshow or event', event: true },\n  { label: 'Shirts, promotional items, signage or printing', purchase: true },\n  { label: 'Photography, video, rendering or graphic' },\n  { label: 'Business process or internal tool' },\n  { label: 'Strategy, research or planning' },\n  { label: 'Other', other: true }\n];\n\nconst TRIGGERS = [\n  { key: 'purchase', label: 'A purchase, order or spending' },\n  { key: 'technical', label: 'Technical or product information' },\n  { key: 'event', label: 'An event or tradeshow' }\n];\n\nconst CONFIRMATIONS = [\n  'I have identified the Project Owner and appropriate decision-makers.',\n  'The relevant stakeholders have discussed the request, or I have disclosed what is still unresolved.',\n  'The information provided is current and comes from the appropriate source.',\n  'I have identified the budget and expense approver if the request involves spending.',\n  'I understand that incomplete information or changes after work begins may affect timing and cost.'\n];\n\nconst NAV = [\n  { icon: 'gauge', label: 'Dashboard' },\n  { group: 'Organizational accelerators' },\n  { icon: 'list', label: 'ARS Switch Configuration' },\n  { icon: 'chart-column', label: 'Sales Action Center' },\n  { icon: 'circle-alert', label: 'Corrective Action Reports' },\n  { icon: 'wrench', label: 'Field Support Service Log' },\n  { icon: 'file-text', label: 'Assembly Index' },\n  { group: 'Tools' },\n  { icon: 'cpu', label: 'ARMMI Updater' },\n  { icon: 'map', label: 'Pathfinder Planner', dim: true },\n  { icon: 'mail', label: 'Start a Marketing Project', active: true },\n  { group: 'Production' },\n  { icon: 'settings', label: 'ARS Active Production' },\n  { icon: 'sliders-horizontal', label: 'Application Engineering SWAG' },\n  { icon: 'radio', label: 'Maxon Label Generator' }\n];\n\nclass Component extends DCLogic {\n  state = {\n    submitted: false,\n    text: {},\n    picked: {},\n    manual: {},\n    agreement: 'yes',\n    infoOutstanding: 'no',\n    purchaseStatus: '',\n    specsConfirmed: '',\n    confirmed: {},\n    people: [{ name: '', role: '' }, { name: '', role: '' }]\n  };\n\n  t(k) { return this.state.text[k] || ''; }\n  setT(k) { return e => { const v = e.target.value; this.setState(s => ({ text: Object.assign({}, s.text, { [k]: v }) })); }; }\n  filled(k) { return this.t(k).trim().length > 0; }\n\n  flags() {\n    const st = this.state;\n    const f = { purchase: false, technical: false, event: false };\n    TYPES.forEach(t => {\n      if (!st.picked[t.label]) return;\n      if (t.purchase) f.purchase = true;\n      if (t.technical) f.technical = true;\n      if (t.event) f.event = true;\n    });\n    if (st.picked['Other']) {\n      TRIGGERS.forEach(g => { if (st.manual[g.key]) f[g.key] = true; });\n    }\n    return f;\n  }\n\n  requiredKeys() {\n    const st = this.state;\n    const f = this.flags();\n    const keys = ['requestName', 'describe', 'prompted', 'accomplish', 'dueDate', 'dueDriver',\n                  'owner', 'authority', 'facts', 'contact'];\n    if (st.picked['Other']) keys.push('otherType');\n    if (st.agreement !== 'yes') keys.push('openDecisions');\n    if (st.infoOutstanding === 'yes') keys.push('infoOutstandingNote');\n    if (f.purchase) keys.push('orderWhat', 'budgetSource', 'expenseApprover');\n    if (f.technical) keys.push('product', 'specsConfirmedBy', 'techOpen');\n    if (f.event) keys.push('eventName', 'eventDate', 'eventLocation', 'eventNeeds', 'eventOwner');\n    return keys;\n  }\n\n  extraKeys() {\n    const f = this.flags();\n    const keys = ['type'];\n    if (f.purchase) keys.push('purchaseStatus');\n    if (f.technical) keys.push('specsConfirmed');\n    CONFIRMATIONS.forEach((_, i) => keys.push('confirm' + i));\n    return keys;\n  }\n\n  missing() {\n    const st = this.state;\n    const f = this.flags();\n    const m = [];\n    this.requiredKeys().forEach(k => { if (!this.filled(k)) m.push(k); });\n    if (!TYPES.some(t => st.picked[t.label])) m.push('type');\n    if (f.purchase && !st.purchaseStatus) m.push('purchaseStatus');\n    if (f.technical && !st.specsConfirmed) m.push('specsConfirmed');\n    CONFIRMATIONS.forEach((_, i) => { if (!st.confirmed[i]) m.push('confirm' + i); });\n    return m;\n  }\n\n  section(keys, missing) {\n    const done = keys.filter(k => missing.indexOf(k) === -1).length;\n    if (!keys.length) return { label: 'COMPLETE', color: 'var(--status-normal)' };\n    if (done === keys.length) return { label: 'COMPLETE', color: 'var(--status-normal)' };\n    return { label: done + '/' + keys.length + ' REQUIRED', color: done ? 'var(--ars-amber)' : 'var(--text-subtle)' };\n  }\n\n  updateRow(i, key, value) {\n    this.setState(s => {\n      const rows = s.people.slice();\n      rows[i] = Object.assign({}, rows[i], { [key]: value });\n      return { people: rows };\n    });\n  }\n\n  renderVals() {\n    const st = this.state;\n    const f = this.flags();\n    const missing = this.missing();\n    const canSubmit = missing.length === 0;\n    const total = this.requiredKeys().length + this.extraKeys().length;\n    const confirmedCount = CONFIRMATIONS.filter((_, i) => st.confirmed[i]).length;\n\n    const vals = {\n      submitted: st.submitted,\n      editing: !st.submitted,\n      nav: NAV.map((n, i) => ({\n        key: i,\n        isGroup: !!n.group,\n        isLink: !n.group,\n        label: n.group || n.label,\n        icon: n.icon,\n        bg: n.active ? '#eef5fe' : 'transparent',\n        rule: n.active ? 'var(--ars-blue)' : 'transparent',\n        color: n.active ? 'var(--ars-blue)' : 'var(--text-body)',\n        opacity: n.dim ? 0.45 : 1\n      })),\n      types: TYPES.map(t => ({\n        label: t.label,\n        checked: !!st.picked[t.label],\n        toggle: () => this.setState(s => ({ picked: Object.assign({}, s.picked, { [t.label]: !s.picked[t.label] }) }))\n      })),\n      otherPicked: !!st.picked['Other'],\n      triggers: TRIGGERS.map(g => ({\n        label: g.label,\n        checked: !!st.manual[g.key],\n        toggle: () => this.setState(s => ({ manual: Object.assign({}, s.manual, { [g.key]: !s.manual[g.key] }) }))\n      })),\n      agreementOptions: [\n        { value: 'yes', label: 'Yes' },\n        { value: 'notyet', label: 'Not yet' },\n        { value: 'open', label: 'Some decisions are still open' }\n      ],\n      f_agreement: st.agreement,\n      set_agreement: v => this.setState({ agreement: v }),\n      agreementOpen: st.agreement !== 'yes',\n      noYesOptions: [{ value: 'no', label: 'No' }, { value: 'yes', label: 'Yes' }],\n      f_infoOutstanding: st.infoOutstanding,\n      set_infoOutstanding: v => this.setState({ infoOutstanding: v }),\n      infoOutstandingYes: st.infoOutstanding === 'yes',\n      purchaseStatusOptions: ['Approved', 'Pending approval', 'Awaiting options or pricing'],\n      f_purchaseStatus: st.purchaseStatus,\n      set_purchaseStatus: e => this.setState({ purchaseStatus: e.target.value }),\n      confirmedOptions: ['Yes — confirmed', 'Partially', 'Not yet'],\n      f_specsConfirmed: st.specsConfirmed,\n      set_specsConfirmed: e => this.setState({ specsConfirmed: e.target.value }),\n      people: st.people.map((r, i) => ({\n        name: r.name,\n        role: r.role,\n        setName: e => this.updateRow(i, 'name', e.target.value),\n        setRole: e => this.updateRow(i, 'role', e.target.value),\n        remove: () => this.setState(s => {\n          const rows = s.people.slice();\n          rows.splice(i, 1);\n          return { people: rows.length ? rows : [{ name: '', role: '' }] };\n        })\n      })),\n      addPerson: () => this.setState(s => ({ people: s.people.concat([{ name: '', role: '' }]) })),\n      isPurchase: f.purchase,\n      isTechnical: f.technical,\n      isEvent: f.event,\n      anyConditional: f.purchase || f.technical || f.event,\n      confirmNumber: (f.purchase || f.technical || f.event) ? 6 : 5,\n      confirmations: CONFIRMATIONS.map((label, i) => ({\n        label,\n        checked: !!st.confirmed[i],\n        bg: st.confirmed[i] ? '#f5faf5' : '#fff',\n        toggle: () => this.setState(s => ({ confirmed: Object.assign({}, s.confirmed, { [i]: !s.confirmed[i] }) }))\n      })),\n      submitDisabled: !canSubmit,\n      submit: () => { if (canSubmit) this.setState({ submitted: true }); },\n      saveDraft: () => {},\n      reset: () => this.setState({ submitted: false }),\n      doneCount: total - missing.length,\n      totalCount: total,\n      gateColor: canSubmit ? 'var(--status-normal)' : 'var(--text-strong)',\n      gateTitle: canSubmit ? 'Ready to submit.' : missing.length + ' required item' + (missing.length === 1 ? '' : 's') + ' outstanding.',\n      gateDetail: canSubmit\n        ? 'Ownership, information, contacts and all five confirmations are accounted for.'\n        : 'Submission stays locked until the required fields and all five confirmations are complete (' + confirmedCount + '/5 confirmed).'\n    };\n\n    ['requestName', 'describe', 'prompted', 'accomplish', 'dueDate', 'dueDriver', 'otherType',\n     'owner', 'authority', 'openDecisions', 'audience', 'facts', 'contact', 'infoOutstandingNote', 'links',\n     'orderWhat', 'budget', 'budgetSource', 'expenseApprover',\n     'product', 'specsConfirmedBy', 'techOpen',\n     'eventName', 'eventDate', 'eventLocation', 'eventNeeds', 'eventOwner', 'eventConfirmed',\n     'additional'].forEach(k => {\n      vals['f_' + k] = this.t(k);\n      vals['set_' + k] = this.setT(k);\n    });\n\n    const s1 = this.section(['requestName', 'describe', 'prompted', 'accomplish', 'dueDate', 'dueDriver'], missing);\n    const s2keys = st.picked['Other'] ? ['type', 'otherType'] : ['type'];\n    const s2 = this.section(s2keys, missing);\n    const s3keys = ['owner', 'authority'];\n    if (st.agreement !== 'yes') s3keys.push('openDecisions');\n    const s3 = this.section(s3keys, missing);\n    const s4keys = ['facts', 'contact'];\n    if (st.infoOutstanding === 'yes') s4keys.push('infoOutstandingNote');\n    const s4 = this.section(s4keys, missing);\n    const s5keys = [];\n    if (f.purchase) s5keys.push('orderWhat', 'budgetSource', 'expenseApprover', 'purchaseStatus');\n    if (f.technical) s5keys.push('product', 'specsConfirmed', 'specsConfirmedBy', 'techOpen');\n    if (f.event) s5keys.push('eventName', 'eventDate', 'eventLocation', 'eventNeeds', 'eventOwner');\n    const s5 = this.section(s5keys, missing);\n\n    vals.s1Label = s1.label; vals.s1Color = s1.color;\n    vals.s2Label = s2.label; vals.s2Color = s2.color;\n    vals.s3Label = s3.label; vals.s3Color = s3.color;\n    vals.s4Label = s4.label; vals.s4Color = s4.color;\n    vals.s5Label = s5.label; vals.s5Color = s5.color;\n    vals.s6Label = confirmedCount + '/5 CONFIRMED';\n    vals.s6Color = confirmedCount === 5 ? 'var(--status-normal)' : (confirmedCount ? 'var(--ars-amber)' : 'var(--text-subtle)');\n\n    if (canSubmit) {\n      vals.readyLabel = 'Ready to submit';\n      vals.readyBg = '#eef8ee'; vals.readyBorder = '#c8e6c6'; vals.readyColor = '#2c7a28'; vals.readyDot = 'var(--status-normal)';\n    } else {\n      vals.readyLabel = 'Incomplete';\n      vals.readyBg = '#fdf6e6'; vals.readyBorder = '#f2e2b5'; vals.readyColor = '#8a6206'; vals.readyDot = 'var(--ars-amber)';\n    }\n    return vals;\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
